[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haryana-mound-apm"
version = "0.2.1"
description = "Scoped GeoAI Archaeological Mound Prospection & Spatial Evaluation Benchmark for Haryana (Hisar, Fatehabad, Sirsa)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "lightgbm>=4.0.0",
    "earthengine-api>=0.1.370",
    "h3>=3.7.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
