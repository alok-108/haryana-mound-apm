[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haryana-mound-apm"
version = "0.4.0"
description = "Pan-Subcontinent Pre-600 BCE Archaeological Predictive Modeling, Multi-Sensor Gating & Live Satellite GIS"
readme = "README.md"
authors = [
    {name = "Alok", email = "166419621+alok-108@users.noreply.github.com"}
]
license = "MIT"
keywords = [
    "archaeology",
    "remote-sensing",
    "indus-valley",
    "harappan",
    "vedic",
    "pre-600-bce",
    "gis",
    "satellite",
    "sar",
    "predictive-modeling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pillow>=9.0.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "earthengine-api>=0.1.370",
    "h3>=3.7.6",
]

[project.urls]
Homepage = "https://github.com/alok-108/haryana-mound-apm"
Repository = "https://github.com/alok-108/haryana-mound-apm.git"
Issues = "https://github.com/alok-108/haryana-mound-apm/issues"

[project.scripts]
apm-serve = "scripts.serve_discovery_app:main"
apm-discover = "scripts.discover_subcontinent:run_subcontinent_discovery"
apm-benchmark = "scripts.run_known_monuments_benchmark:run_benchmark_cli"
apm-scan = "scripts.cli_scan:main"
apm-export = "scripts.cli_export:main"
apm-dossier = "scripts.cli_dossier:main"
apm-package-qgis = "scripts.package_qgis_plugin:build_qgis_zip"
apm-hybrid = "scripts.run_hybrid_pipeline:main"
apm-cross-basin = "scripts.run_cross_basin_benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "qgis_plugin*"]

[tool.setuptools.package-data]
"*" = ["*.csv", "*.geojson", "*.html", "*.png", "*.md", "*.yaml", "*.txt", "*.json", "*.zip"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
